[package]
name = "ezcount"
version = "0.3.0"
description = "Local-first expense sharing for groups"
authors = ["nonock"]
edition = "2021"
# The newest `rust-version` among the dependencies.
rust-version = "1.87"
default-run = "ezcount"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ezcount_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
ezcount-core = { path = "../core" }
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
specta = { version = "=2.0.0-rc.20", features = ["derive", "chrono"] }
specta-typescript = "=0.0.7"
tauri-specta = { version = "=2.0.0-rc.20", features = ["typescript"] }
tokio = { version = "1.53.1", features = ["time", "sync", "macros", "rt"] }
tauri-plugin-deep-link = "2.4"

[lints.rust]
linker_messages = "allow"

# Every `unsafe` block explains why it is sound (CI runs clippy with -D warnings).
[lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"

# Smaller, faster release binaries (matters most for the Android APK). Panics still unwind:
# `AppState::store` relies on recovering a poisoned lock.
[profile.release]
codegen-units = 1
lto = true
strip = true

# Password hashing is deliberately expensive; unoptimized it takes many seconds in dev builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The periodic job that syncs for notifications calls into the library (`notify.rs`).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Crisp window icons (see `set_crisp_window_icons` in lib.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
