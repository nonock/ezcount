[package]
name = "ezcount"
version = "0.1.0"
description = "Local-first expense sharing for groups"
authors = ["nonock"]
edition = "2021"
default-run = "ezcount"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ezcount_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
specta = { version = "=2.0.0-rc.20", features = ["derive", "chrono"] }
specta-typescript = "=0.0.7"
tauri-specta = { version = "=2.0.0-rc.20", features = ["typescript"] }
loro = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.23.1"
getrandom = "0.3"
tokio = { version = "1.53.1", features = ["time", "sync", "macros"] }
url = "2"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
ezcount-sync-server = { path = "../sync-server" }
tauri = { version = "2", features = ["test"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros"] }

[lints.rust]
linker_messages = "allow"

# Smaller, faster release binaries (matters most for the Android APK). Panics still unwind:
# `AppState::store` relies on recovering a poisoned lock.
[profile.release]
codegen-units = 1
lto = true
strip = true

# Password hashing is deliberately expensive; unoptimized it takes many seconds in dev builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
