<!doctype html>
<!-- The frame of the pages the relay has about itself (privacy.html, delete-account.html):
     web.rs puts a page's text in it, which comes in English and in French. Both are in the
     page; the script shows one, so without it both can still be read. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><!--title--></title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --text: #18181b;
        --muted: #71717a;
        --border: #e4e4e7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --text: #fafafa;
          --muted: #a1a1aa;
          --border: #27272a;
        }
      }
      body {
        margin: 0;
        padding: 24px 16px 48px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 system-ui, sans-serif;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
      }
      /* Between the two languages, when both show. */
      article:not([hidden]) + article {
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
      }
      h1 {
        margin: 16px 0 4px;
        font-size: 1.6rem;
        line-height: 1.3;
      }
      h2 {
        margin: 32px 0 8px;
        font-size: 1.1rem;
      }
      p,
      ul,
      ol {
        margin: 0 0 12px;
      }
      ul,
      ol {
        padding-left: 1.25rem;
      }
      li {
        margin-bottom: 6px;
      }
      a {
        color: inherit;
      }
      .date,
      .languages {
        color: var(--muted);
        font-size: 0.875rem;
      }
      .languages a[aria-current] {
        color: var(--text);
        font-weight: 600;
        text-decoration: none;
      }
      .lead {
        margin-top: 16px;
        font-size: 1.05rem;
      }
      /* What depends on the relay: who runs it, and whether it serves the web version. */
      body:not([data-contact]) .has-contact,
      body[data-contact] .no-contact,
      body:not([data-web]) .has-web,
      body[data-web] .no-web {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <nav class="languages" hidden>
        <a href="?lang=en" lang="en">English</a> · <a href="?lang=fr" lang="fr">Français</a>
      </nav>
      <!--text-->
    </main>
    <script>
      // The language asked for in the address, or the browser's.
      const asked = new URLSearchParams(location.search).get("lang");
      const language = (asked ?? navigator.language).toLowerCase().startsWith("fr") ? "fr" : "en";
      document.documentElement.lang = language;
      for (const text of document.querySelectorAll("article")) text.hidden = text.lang !== language;
      document.title = document.querySelector(`article[lang="${language}"] h1`).textContent + " · ezcount";
      const languages = document.querySelector(".languages");
      languages.querySelector(`[lang="${language}"]`).setAttribute("aria-current", "true");
      languages.hidden = false;
      // The relay's other pages open in the language picked here.
      if (asked) {
        for (const link of document.querySelectorAll("a.page")) link.href += "?lang=" + language;
      }
    </script>
  </body>
</html>
