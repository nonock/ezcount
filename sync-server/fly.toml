# Fly.io config for the relay. First setup: "Hosting the relay on Fly.io" in the README.
# Releases deploy it from .github/workflows/release.yml; by hand, from this directory:
#   fly deploy --ha=false
#
# One machine only (--ha=false): the data is a SQLite file on the machine's volume, and a
# second machine would get its own, separate volume.

# Globally unique on Fly.io; change it if the name is taken.
app = "ezcount-relay"
primary_region = "cdg" # Paris
# The relay shuts down cleanly on SIGINT.
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
dockerfile = "Dockerfile"
build-target = "fly"

[env]
# Fly's proxy sets this to the client's address (and overwrites any sent by the client), for
# the relay's per-client limits.
EZCOUNT_CLIENT_IP_HEADER = "Fly-Client-IP"
# Stored data in all: under the 1 GB volume, leaving room for SQLite and snapshots. Raise it
# with the volume (`fly volumes extend`).
EZCOUNT_MAX_STORAGE_MB = "800"
# Lets the Android app open this relay's invite links directly (Android App Links); the app
# declares this host in tauri.conf.json. Only the private release key's fingerprint: builds
# signed with the public test key must not receive invite links, which carry group keys.
EZCOUNT_ANDROID_PACKAGE = "com.ezvany.ezcount"
EZCOUNT_ANDROID_CERT_SHA256 = "64:BA:09:A3:99:66:5A:79:4C:F6:FC:18:EC:49:82:E0:87:30:9C:2A:05:35:F2:09:D7:F4:35:52:9F:72:48:21"

[[mounts]]
source = "relay_data"
destination = "/data"
# Created on the first deploy; grow it later with `fly volumes extend`.
initial_size = "1gb"
# Fly snapshots the volume daily; keep two weeks of them.
snapshot_retention = 14

[http_service]
internal_port = 8787
force_https = true
# Stops when no app has talked to it for a few minutes and starts again on the next request,
# in about a second. Open apps pull every 20 seconds, which keeps it running meanwhile.
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
method = "GET"
path = "/health"
interval = "30s"
timeout = "5s"
grace_period = "10s"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
