[package]
name = "ezcount-sync-server"
version = "0.4.0"
description = "Relay that stores and forwards ezcount group updates"
edition = "2021"
# The newest `rust-version` among the dependencies.
rust-version = "1.85"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
axum = "0.8"
base64 = "0.23"
# Asks the rate service for exchange rates (`Settings::rates_url`).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# Serves the web version (`Settings::web_dir`).
tower-http = { version = "0.7", features = ["fs", "set-header"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
