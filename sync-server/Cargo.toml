[package]
name = "ezcount-sync-server"
version = "0.1.0"
description = "Relay that stores and forwards ezcount group updates"
edition = "2021"

[dependencies]
axum = "0.8"
base64 = "0.23"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
