[package]
name = "ezcount-core"
description = "ezcount without a user interface: groups, balances, encryption, storage and sync"
authors = ["nonock"]
edition = "2021"
# The newest `rust-version` among the dependencies.
rust-version = "1.87"
# Not released on its own: the app (src-tauri) carries the version.
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Derives the TypeScript types of `models` for the app's bindings; the same version as the
# app's tauri-specta.
specta = { version = "=2.0.0-rc.20", features = ["derive", "chrono"] }
loro = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.23.1"
getrandom = "0.4"
# Only the runtime-independent parts (and, natively, blocking-thread helpers): the app owns the
# runtime.
tokio = { version = "1.53.1", features = ["sync"] }
url = "2"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
zxcvbn = "3.1"
csv = "1.4"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

# In the browser, randomness comes from the Web Crypto API (crypto.getRandomValues).
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
# Loro's older getrandom.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
# End-to-end sync tests run a real relay in-process.
ezcount-sync-server = { path = "../sync-server" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros"] }

[lints.rust]
unsafe_code = "forbid"

# Password hashing is deliberately expensive; unoptimized it takes many seconds in dev builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
