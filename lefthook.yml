# Git hooks for ezcount. Docs: https://lefthook.dev
#
# pre-commit  fast checks on staged files; formatters fix and re-stage what they touch
# commit-msg  Conventional Commits subject (feat:, fix(ui):, ...)
# pre-push    test suites (Rust unit + relay end-to-end, Playwright)
#
# Skip once with LEFTHOOK=0 git commit ..., or a single job with LEFTHOOK_EXCLUDE=e2e git push.
# Personal overrides go in lefthook-local.yml (git-ignored).

# `*` stops at `/` and `**/` also matches the root, so globs read like .gitignore patterns.
glob_matcher: doublestar

pre-commit:
  # Bindings first: the TypeScript check must see the regenerated `src/bindings.ts`.
  piped: true
  jobs:
    - name: bindings
      glob:
        - "src-tauri/src/**/*.rs"
        - "src-tauri/Cargo.toml"
        # The command types (`models.rs`) live in the core crate.
        - "core/src/**/*.rs"
        - "src/bindings.ts"
      run: cargo run --quiet --manifest-path src-tauri/Cargo.toml --bin export_bindings && git add src/bindings.ts

    - name: checks
      group:
        parallel: true
        jobs:
          - name: app-rust
            group:
              # Format before linting so clippy reports the final line numbers. The core crate
              # is in the same group because the app compiles it too.
              piped: true
              jobs:
                - name: core-fmt
                  glob: "core/**/*.rs"
                  run: cargo fmt --manifest-path core/Cargo.toml
                  stage_fixed: true
                - name: app-fmt
                  glob: "src-tauri/**/*.rs"
                  run: cargo fmt --manifest-path src-tauri/Cargo.toml
                  stage_fixed: true
                - name: web-fmt
                  glob: "web/**/*.rs"
                  run: cargo fmt --manifest-path web/Cargo.toml
                  stage_fixed: true
                - name: core-clippy
                  # The core's tests link the relay crate, so relay changes can break them too.
                  glob:
                    - "core/**/*.rs"
                    - "core/Cargo.{toml,lock}"
                    - "sync-server/src/**/*.rs"
                  run: cargo clippy --quiet --manifest-path core/Cargo.toml --all-targets -- -D warnings
                - name: app-clippy
                  glob:
                    - "src-tauri/**/*.rs"
                    - "src-tauri/Cargo.{toml,lock}"
                    - "core/**/*.rs"
                    - "core/Cargo.toml"
                  run: cargo clippy --quiet --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
                - name: wasm-clippy
                  # The web version's code behind cfg(target_family = "wasm"). Needs clang (or
                  # NDK_HOME), as `bun run build:wasm` does.
                  glob:
                    - "core/**/*.rs"
                    - "core/Cargo.{toml,lock}"
                    - "web/**/*.rs"
                    - "web/Cargo.{toml,lock}"
                  run: bun run lint:wasm

          - name: relay-rust
            group:
              piped: true
              jobs:
                - name: relay-fmt
                  glob: "sync-server/**/*.rs"
                  run: cargo fmt --manifest-path sync-server/Cargo.toml
                  stage_fixed: true
                - name: relay-clippy
                  glob:
                    - "sync-server/**/*.rs"
                    - "sync-server/Cargo.{toml,lock}"
                  run: cargo clippy --quiet --manifest-path sync-server/Cargo.toml --all-targets -- -D warnings

          - name: frontend
            group:
              piped: true
              jobs:
                - name: biome
                  glob: "**/*.{js,ts,cjs,mjs,json,jsonc,css,html,svelte}"
                  run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
                  stage_fixed: true
                - name: prettier
                  # Formats the Svelte components, which Biome only lints.
                  glob: "src/**/*.svelte"
                  run: bunx prettier --write {staged_files}
                  stage_fixed: true
                - name: typecheck
                  # Rust changes can change the generated bindings the frontend is checked against.
                  glob:
                    - "{src,e2e}/**/*.{ts,svelte}"
                    - "*.ts"
                    - "tsconfig*.json"
                    - "package.json"
                    - "src-tauri/src/**/*.rs"
                    - "core/src/**/*.rs"
                  run: bun run typecheck

          - name: tauri-versions
            # Rust crates and npm packages must share major.minor, or Tauri builds fail in CI.
            glob:
              - "src-tauri/Cargo.{toml,lock}"
              - "package.json"
              - "bun.lock"
            run: bun run check:tauri

    - name: whitespace
      # Trailing whitespace and leftover conflict markers, after the formatters had their say.
      run: git diff --check --cached

commit-msg:
  jobs:
    - name: conventional-commit
      run: bun scripts/check-commit-msg.ts {1}

pre-push:
  parallel: true
  jobs:
    - name: core-tests
      glob:
        - "core/**/*.{rs,toml}"
        - "core/Cargo.lock"
        - "sync-server/src/**/*.rs"
      run: cargo test --quiet --manifest-path core/Cargo.toml

    - name: relay-tests
      glob:
        - "sync-server/**/*.{rs,toml}"
        - "sync-server/Cargo.lock"
      run: cargo test --quiet --manifest-path sync-server/Cargo.toml

    - name: e2e
      glob:
        - "{src,e2e}/**/*"
        - "*.{ts,json,html}"
        - "bun.lock"
      run: bun run test:e2e
