# Installable test builds, downloadable from the run's "Artifacts" section:
# - ezcount-android: optimized APK for arm64 phones, signed with the committed test key
# - ezcount-linux:   .deb and .AppImage
#
# Set the repository variable EZCOUNT_SERVER (Settings > Secrets and variables > Actions >
# Variables) to pre-fill your relay URL on the login screen.
name: Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VITE_EZCOUNT_SERVER: ${{ vars.EZCOUNT_SERVER }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The runner image ships the Android SDK and NDK; Tauri looks for the NDK in NDK_HOME.
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: bunx tauri android build --apk --target aarch64
      - uses: actions/upload-artifact@v7
        with:
          name: ezcount-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  linux:
    # The oldest supported runner, so the packages run on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tauri build --bundles deb,appimage
        env:
          # linuxdeploy is itself an AppImage; runners have no FUSE to mount it.
          APPIMAGE_EXTRACT_AND_RUN: 1
      - uses: actions/upload-artifact@v7
        with:
          name: ezcount-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
