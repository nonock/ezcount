# Installable test builds, downloadable from the run's "Artifacts" section:
# - ezcount-android: optimized APK for arm64 phones, signed with the private release key
# - play-bundle:     the same app as an .aab, the form Google Play takes
# - ezcount-linux:   .deb and .AppImage
# release.yml also calls this workflow to build a release's packages: the GitHub release
# gets the ezcount-* ones, and the bundle of a release is uploaded to Google Play by hand
# (docs/development.md, "Google Play").
#
# The app uses the official relay (https://ezcount-relay.fly.dev) by default. To build for
# another one, set the repository variable EZCOUNT_SERVER (Settings > Secrets and variables >
# Actions > Variables) to its URL.
name: Packages

on:
  push:
    branches: [main]
    # Changes that can't affect the app's packages.
    paths-ignore:
      - "**/*.md"
      - "e2e/**"
      - "sync-server/**"
      - "deploy/**"
      - "scripts/**"
      - ".github/dependabot.yml"
      - ".github/workflows/ci.yml"
      - "lefthook.yml"
      - "biome.json"
      - ".prettierrc.json"
      - ".prettierignore"
      - "playwright.config.ts"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VITE_EZCOUNT_SERVER: ${{ vars.EZCOUNT_SERVER }}
  # Test builds skip the release profile's whole-program optimization (`lto`, one codegen
  # unit), which takes most of the build time on a runner, for a somewhat larger binary.
  # Tagged releases keep it.
  CARGO_PROFILE_RELEASE_LTO: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ github.ref_type == 'tag' && 1 || 16 }}

jobs:
  android:
    # A release commit is built by its tag's release run instead.
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The runner image ships the Android SDK and NDK; Tauri looks for the NDK in NDK_HOME.
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      # These APKs go to other people's phones, so they must carry the private release key:
      # the committed test key is public (see docs/development.md, "Signing key"). No key, no build.
      - name: Release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Set the ANDROID_RELEASE_KEYSTORE and ANDROID_RELEASE_KEYSTORE_PASSWORD secrets (docs/development.md, \"Signing key\")."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "EZCOUNT_RELEASE_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "EZCOUNT_RELEASE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      # The APK for the releases page and the bundle for Google Play, from one build.
      - run: bunx tauri android build --apk --aab --target aarch64
      - name: Check the APK and the bundle carry the release key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk \
            | tee /dev/stderr | grep -q "CN=ezcount"
          keytool -printcert -jarfile src-tauri/gen/android/app/build/outputs/bundle/*Release/*.aab \
            | tee /dev/stderr | grep -q "CN=ezcount"
      - uses: actions/upload-artifact@v7
        with:
          name: ezcount-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      # Not named ezcount-*: release.yml attaches those to the GitHub release.
      - uses: actions/upload-artifact@v7
        with:
          name: play-bundle
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

  linux:
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore(release)')
    # The oldest supported runner, so the packages run on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tauri build --bundles deb,appimage
        env:
          # linuxdeploy is itself an AppImage; runners have no FUSE to mount it.
          APPIMAGE_EXTRACT_AND_RUN: 1
      - uses: actions/upload-artifact@v7
        with:
          name: ezcount-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
