# Same checks as the git hooks, on a clean Linux machine. This is also the only place the
# Linux build is exercised.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Seconds, instead of failing halfway through the Android build.
      - name: Tauri versions match
        run: bun run check:tauri
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bunx prettier --check "src/**/*.svelte"
      - run: bun run typecheck
      - run: bun run build

  # Known vulnerabilities in what the lock files pin. Unmaintained crates only warn.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun audit
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: |
          for crate in core src-tauri web sync-server; do
            cargo audit --file "$crate/Cargo.lock"
          done

  # Lint and tests run as separate jobs, in parallel: clippy only type-checks, while tests
  # compile everything, so they share little work anyway.
  rust:
    name: rust-${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.task }}
          workspaces: |
            core -> target
            src-tauri -> target
            sync-server -> target
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # `tauri::generate_context!` embeds the frontend, so it must be built first.
      - run: bun run build
      - name: Format
        if: matrix.task == 'lint'
        run: |
          cargo fmt --manifest-path core/Cargo.toml --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path sync-server/Cargo.toml --check
          cargo fmt --manifest-path web/Cargo.toml --check
      - name: Clippy
        if: matrix.task == 'lint'
        run: |
          cargo clippy --locked --manifest-path core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path sync-server/Cargo.toml --all-targets -- -D warnings
      - name: Test
        if: matrix.task == 'test'
        env:
          # No debug info: faster linking and a smaller cache. Failures still report locations.
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          cargo test --locked --manifest-path core/Cargo.toml
          cargo test --locked --manifest-path sync-server/Cargo.toml
      - name: Bindings are up to date
        if: matrix.task == 'test'
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          cargo run --locked --manifest-path src-tauri/Cargo.toml --bin export_bindings
          git diff --exit-code src/bindings.ts

  # The web version: its WebAssembly-only code linted, then the build tested end to end,
  # served by a real relay.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-web
      - run: bun run lint:wasm
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-web-report
          path: test-results/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the relay image
        uses: docker/build-push-action@v7
        with:
          context: sync-server
          push: false
          load: true
          tags: ezcount-relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the Fly.io variant
        uses: docker/build-push-action@v7
        with:
          context: sync-server
          target: fly
          push: false
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run -d --name relay -p 8787:8787 ezcount-relay:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8787/health && exit 0; sleep 1; done
          docker logs relay
          exit 1
