# Weekly dependency updates, grouped into one PR per ecosystem for minor/patch bumps.
# Majors come as separate PRs. The 7-day cooldown matches `minimumReleaseAge` in bunfig.toml.
#
# Tauri: the Rust crates and the npm packages must stay on the same major.minor, and the
# crates must move together, so each side gets its own group and only patch updates here.
# Minor upgrades are done by hand on both sides at once (docs/development.md, "Upgrading Tauri").
version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      frontend:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: cargo
    # Every Cargo project has its own lock file (no workspace), and core's and web's hold most of
    # the app's crates (rusqlite, loro, the crypto), so all four are watched.
    directories: [/core, /src-tauri, /web, /sync-server]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      rust:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Pinned together: tauri-specta only works with this exact specta release candidate.
      - dependency-name: specta
      - dependency-name: specta-typescript
      - dependency-name: tauri-specta
      # 0.13's rustls backend pulls aws-lc-rs and the platform verifier, which break Android builds.
      - dependency-name: reqwest
        versions: [">=0.13"]

  # The Android project Tauri generated: the AndroidX libraries, the Gradle wrapper and plugins.
  # Android Gradle Plugin and Kotlin majors follow Tauri's template, so they are done by hand.
  - package-ecosystem: gradle
    directory: /src-tauri/gen/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      android:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /sync-server
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
